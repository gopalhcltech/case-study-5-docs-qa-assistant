<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f0">
  <title>Solstice | Admin Help</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f6f0;
      --white: #ffffff;
      --ink: #17312d;
      --muted: #667874;
      --line: #d9e2dc;
      --green: #18776b;
      --green-dark: #10574f;
      --acid: #d5ed70;
      --coral: #d96045;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Avenir Next", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(23, 49, 45, .035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(23, 49, 45, .035) 1px, transparent 1px);
      background-size: 34px 34px;
      font-family: var(--sans);
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(22px, 6vw, 88px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .78);
    }

    .wordmark { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .mark { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink); background: var(--acid); border-radius: 50%; font-family: var(--serif); font-size: 17px; }
    .topbar-note { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .13em; }

    main { width: min(100% - 44px, 980px); margin: 0 auto; padding: 82px 0 64px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) 190px; align-items: end; gap: 42px; margin-bottom: 42px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
    .eyebrow::before { width: 26px; height: 2px; content: ""; background: var(--coral); }
    h1 { max-width: 680px; margin: 0; font-family: var(--serif); font-size: clamp(42px, 6vw, 68px); font-weight: 400; line-height: 1.02; letter-spacing: 0; }
    h1 span { color: var(--green); font-style: italic; }
    .intro-note { margin: 0 0 6px; padding-left: 17px; border-left: 1px solid var(--green); color: var(--muted); font-size: 13px; line-height: 1.7; }

    .search-panel { padding: 25px; border: 1px solid var(--line); background: var(--white); box-shadow: 8px 8px 0 rgba(23, 49, 45, .06); }
    .field-label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .search-row { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; height: 56px; padding: 0 16px; border: 1px solid var(--line); border-radius: 2px; outline: none; color: var(--ink); background: #fbfcfa; font: inherit; font-size: 15px; }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(24, 119, 107, .12); }
    input::placeholder { color: #899692; }
    button { font: inherit; cursor: pointer; }
    .ask-button { min-width: 135px; height: 56px; border: 0; border-radius: 2px; color: #fff; background: var(--green); font-size: 13px; font-weight: 800; transition: background .16s ease, transform .16s ease; }
    .ask-button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .ask-button:focus-visible, .sample:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .ask-button:disabled { cursor: wait; opacity: .7; transform: none; }

    .sample-area { display: flex; align-items: flex-start; gap: 17px; margin-top: 21px; }
    .sample-label { flex: 0 0 auto; padding-top: 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .samples { display: flex; flex-wrap: wrap; gap: 7px; }
    .sample { padding: 7px 10px; border: 1px solid var(--line); border-radius: 2px; color: #425954; background: #f8faf7; font-size: 11px; transition: border-color .16s ease, background .16s ease; }
    .sample:hover { border-color: var(--green); background: #f1f7e4; }

    .result-wrap { margin-top: 34px; }
    .result-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .result-head::after { height: 1px; flex: 1; content: ""; background: var(--line); }
    .result { padding: 23px 25px 25px; border-left: 3px solid var(--green); background: rgba(255, 255, 255, .78); animation: arrive .24s ease-out both; }
    .result.abstain { border-left-color: var(--coral); }
    .result p { margin: 0; font-size: 15px; line-height: 1.75; }
    .citation { display: flex; align-items: center; gap: 9px; margin-top: 18px; color: var(--green-dark); font-size: 11px; font-weight: 800; }
    .citation::before { width: 7px; height: 7px; content: ""; background: var(--acid); border: 1px solid #a8bf48; border-radius: 50%; }
    .status { color: var(--muted); font-size: 13px; }
    .status.error { color: #a73827; }

    .bottomline { display: flex; justify-content: space-between; gap: 20px; margin-top: 58px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; }
    .bottomline strong { color: var(--ink); font-weight: 800; }
    [hidden] { display: none !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 700px) {
      main { padding-top: 54px; }
      .intro { grid-template-columns: 1fr; gap: 18px; margin-bottom: 30px; }
      .intro-note { max-width: 390px; }
      .search-panel { padding: 18px; }
      .sample-area { display: block; }
      .sample-label { display: block; margin-bottom: 10px; }
      .bottomline { flex-direction: column; gap: 8px; margin-top: 42px; }
    }

    @media (max-width: 480px) {
      .topbar { height: 60px; padding: 0 20px; }
      .topbar-note { font-size: 9px; }
      main { width: min(100% - 32px, 980px); }
      .search-row { flex-direction: column; }
      .ask-button { width: 100%; }
      .result { padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wordmark"><span class="mark" aria-hidden="true">S</span> SOLSTICE</div>
    <div class="topbar-note">ADMIN SUPPORT / DOCS</div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">HELP DESK <span aria-hidden="true">/</span> DOCUMENTATION</p>
        <h1 id="page-title">A clear answer, <span>from the source.</span></h1>
      </div>
      <p class="intro-note">Search the Solstice admin guides. If the docs don't say, we'll say so.</p>
    </section>

    <section class="search-panel" aria-label="Ask a documentation question">
      <form id="question-form">
        <label class="field-label" for="question">YOUR QUESTION</label>
        <div class="search-row">
          <input id="question" name="question" type="search" placeholder="e.g. How many rows can I export?" autocomplete="off" required>
          <button class="ask-button" id="ask-button" type="submit">Ask the docs <span aria-hidden="true">&rarr;</span></button>
        </div>
      </form>
      <div class="sample-area">
        <span class="sample-label">TRY ONE</span>
        <div class="samples" id="samples">
          <button class="sample" type="button">How do I reset my password?</button>
          <button class="sample" type="button">How long does a reset link last?</button>
          <button class="sample" type="button">What's the CSV export limit?</button>
          <button class="sample" type="button">What are Growth API limits?</button>
          <button class="sample" type="button">Can I connect Salesforce?</button>
        </div>
      </div>
    </section>

    <section class="result-wrap" id="result-wrap" aria-live="polite" hidden>
      <div class="result-head">DOCUMENTATION RESPONSE</div>
      <div class="result" id="result">
        <p id="answer"></p>
        <div class="citation" id="citation" hidden></div>
      </div>
    </section>

    <div class="bottomline">
      <span><strong>06</strong> ARTICLES IN THIS GUIDE</span>
      <span>SUPPORT / SOLSTICE LEARNING</span>
    </div>
  </main>

  <script>
    const form = document.querySelector("#question-form");
    const input = document.querySelector("#question");
    const button = document.querySelector("#ask-button");
    const resultWrap = document.querySelector("#result-wrap");
    const result = document.querySelector("#result");
    const answer = document.querySelector("#answer");
    const citation = document.querySelector("#citation");

    async function ask(question) {
      input.value = question;
      resultWrap.hidden = false;
      result.classList.remove("abstain");
      answer.className = "status";
      answer.textContent = "Searching the admin guides...";
      citation.hidden = true;
      button.disabled = true;
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "The question could not be sent.");
        if (payload.answered) {
          answer.className = "";
          answer.textContent = payload.answer;
          citation.textContent = `${payload.source.title} / ${payload.source.doc_id}`;
          citation.hidden = false;
        } else {
          result.classList.add("abstain");
          answer.className = "";
          answer.textContent = payload.message;
        }
      } catch (error) {
        answer.className = "status error";
        answer.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (input.value.trim()) ask(input.value.trim());
    });
    document.querySelectorAll(".sample").forEach(sample => {
      sample.addEventListener("click", () => ask(sample.textContent));
    });
  </script>
</body>
</html>
